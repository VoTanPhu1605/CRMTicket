<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vé - HelpDesk CRM</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <div w3-include-html="components/sidebar.html"></div>

        <div class="main-content">
            <!-- Header -->
            <div w3-include-html="components/header.html"></div>

            <!-- Content -->
            <div class="content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">Vé</h4>
                    <a href="create-ticket.html" class="btn btn-primary">
                        <i class="bi bi-plus"></i> Tạo vé
                    </a>
                </div>

                <!-- Search and Filters -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <input type="text" class="form-control" placeholder="Tìm kiếm vé...">
                            </div>
                            <div class="col-md-2">
                                <select class="form-select">
                                    <option selected>Trạng thái</option>
                                    <option>Mở</option>
                                    <option>Đang xử lý</option>
                                    <option>Đã đóng</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <select class="form-select">
                                    <option selected>Mức độ ưu tiên</option>
                                    <option>Cao</option>
                                    <option>Trung bình</option>
                                    <option>Thấp</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <select class="form-select">
                                    <option selected>Đại lý</option>
                                    <option>John Doe</option>
                                    <option>Jane Smith</option>
                                    <option>Bob Johnson</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-secondary w-100">Lọc</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tickets Table -->
                <div w3-include-html="components/ticket-table.html"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/app.js"></script>
    <!-- Include HTML components -->
    <script src="https://www.w3schools.com/lib/w3.js"></script>
    <script>w3.includeHTML();</script>
</body>
</html>

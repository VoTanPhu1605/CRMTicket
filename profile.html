<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ - HelpDesk CRM</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <div w3-include-html="components/sidebar.html"></div>

        <div class="main-content">
            <!-- Header -->
            <div w3-include-html="components/header.html"></div>

            <!-- Content -->
            <div class="content">
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header">
                                <h4 class="mb-0">Cài đặt hồ sơ</h4>
                            </div>
                            <div class="card-body">
                                <!-- Avatar -->
                                <div class="text-center mb-4">
                                    <img src="https://via.placeholder.com/100" alt="Profile Avatar" class="avatar mb-3">
                                    <br>
                                    <button class="btn btn-outline-primary btn-sm">Thay đổi avatar</button>
                                </div>

                                <!-- Profile Form -->
                                <form id="profileForm" onsubmit="return validateForm('profileForm')">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="name" class="form-label">Họ và tên</label>
                                            <input type="text" class="form-control" id="name" value="John Doe" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="email" class="form-label">Email</label>
                                            <input type="email" class="form-control" id="email" value="john@example.com" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                            <label for="phone" class="form-label">Số điện thoại</label>
                                        <input type="tel" class="form-control" id="phone" value="+1 234 567 8900" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Cập nhật hồ sơ</button>
                                </form>

                                <hr class="my-4">

                                <!-- Change Password -->
                                <h5 class="mb-3">Thay đổi mật khẩu</h5>
                                <form id="passwordForm" onsubmit="return validateForm('passwordForm')">
                                    <div class="mb-3">
                                        <label for="oldPassword" class="form-label">Mật khẩu cũ</label>
                                        <input type="password" class="form-control" id="oldPassword" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="newPassword" class="form-label">Mật khẩu mới</label>
                                        <input type="password" class="form-control" id="newPassword" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
                                        <input type="password" class="form-control" id="confirmPassword" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Thay đổi mật khẩu</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/app.js"></script>
    <!-- Include HTML components -->
    <script src="https://www.w3schools.com/lib/w3.js"></script>
    <script>w3.includeHTML();</script>
</body>
</html>

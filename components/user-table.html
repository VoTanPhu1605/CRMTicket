<!-- user-table.html - User table component -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Danh sách người dùng</h5>
    </div>
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>Avatar</th>
                    <th>Tên</th>
                    <th>Vai trò</th>
                    <th>Email</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><img src="https://via.placeholder.com/40" alt="Avatar" class="avatar"></td>
                    <td>John Doe</td>
                    <td><span class="badge role-admin">Quản trị viên</span></td>
                    <td>john@example.com</td>
                    <td><span class="badge status-closed">Hoạt động</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary">Chỉnh sửa</button>
                        <button class="btn btn-sm btn-outline-secondary">Khóa</button>
                        <button class="btn btn-sm btn-outline-danger">Đặt lại</button>
                    </td>
                </tr>
                <tr>
                    <td><img src="https://via.placeholder.com/40" alt="Avatar" class="avatar"></td>
                    <td>Jane Smith</td>
                    <td><span class="badge role-manager">Quản lý</span></td>
                    <td>jane@example.com</td>
                    <td><span class="badge status-closed">Hoạt động</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary">Chỉnh sửa</button>
                        <button class="btn btn-sm btn-outline-secondary">Khóa</button>
                        <button class="btn btn-sm btn-outline-danger">Đặt lại</button>
                    </td>
                </tr>
                <tr>
                    <td><img src="https://via.placeholder.com/40" alt="Avatar" class="avatar"></td>
                    <td>Bob Johnson</td>
                    <td><span class="badge role-agent">Đại lý</span></td>
                    <td>bob@example.com</td>
                    <td><span class="badge status-open">Không hoạt động</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary">Chỉnh sửa</button>
                        <button class="btn btn-sm btn-outline-secondary">Khóa</button>
                        <button class="btn btn-sm btn-outline-danger">Đặt lại</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<!-- Modal Thêm người dùng -->
<div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addUserModalLabel">Thêm người dùng mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addUserForm">
                    <div class="mb-3">
                        <label for="userFullName" class="form-label">Họ và tên</label>
                        <input type="text" class="form-control" id="userFullName" required>
                    </div>
                    <div class="mb-3">
                        <label for="userEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="userEmail" required>
                    </div>
                    <div class="mb-3">
                        <label for="userRole" class="form-label">Vai trò</label>
                        <select class="form-select" id="userRole" required>
                            <option value="">Chọn vai trò</option>
                            <option value="admin">Quản trị viên</option>
                            <option value="manager">Quản lý</option>
                            <option value="agent">Đại lý</option>
                            <option value="viewer">Xem</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="userStatus" class="form-label">Trạng thái</label>
                        <select class="form-select" id="userStatus" required>
                            <option value="active">Hoạt động</option>
                            <option value="inactive">Không hoạt động</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="userPassword" class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control" id="userPassword" required>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary">Thêm</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

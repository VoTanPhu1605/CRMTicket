<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao vé - HelpDesk CRM</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <div w3-include-html="components/sidebar.html"></div>

        <div class="main-content">
            <!-- Header -->
            <div w3-include-html="components/header.html"></div>

            <!-- Content -->
            <div class="content">
                <div class="row">
                    <div class="col-md-4">
                        <!-- Ticket Info -->
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Thông tin vé</h5>
                            </div>
                            <div class="card-body">
                                <h6>#001 - Vấn đề đăng nhập</h6>
                                <p class="text-muted mb-2">Người dùng không thể đăng nhập vào hệ thống.</p>
                                <div class="d-flex gap-2 mb-2">
                                    <span class="badge priority-high">Cao</span>
                                    <span class="badge status-open">Mở</span>
                                </div>
                                <small class="text-muted">Tạo: 2023-10-01</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <!-- Agents List -->
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Giao cho đại lý</h5>
                            </div>
                            <div class="card-body">
                                <div class="agent-item d-flex align-items-center justify-content-between p-3 border rounded mb-3">
                                    <div class="d-flex align-items-center">
                                        <img src="https://via.placeholder.com/50" alt="Agent" class="avatar me-3">
                                        <div>
                                            <div class="fw-bold">Jane Doe</div>
                                            <small class="text-muted">5 vé mở</small>
                                        </div>
                                    </div>
                                    <button class="btn btn-primary btn-sm">Giao</button>
                                </div>
                                <div class="agent-item d-flex align-items-center justify-content-between p-3 border rounded mb-3">
                                    <div class="d-flex align-items-center">
                                        <img src="https://via.placeholder.com/50" alt="Agent" class="avatar me-3">
                                        <div>
                                            <div class="fw-bold">Bob Johnson</div>
                                            <small class="text-muted">3 vé mở</small>
                                        </div>
                                    </div>
                                    <button class="btn btn-primary btn-sm">Giao</button>
                                </div>
                                <div class="agent-item d-flex align-items-center justify-content-between p-3 border rounded mb-3">
                                    <div class="d-flex align-items-center">
                                        <img src="https://via.placeholder.com/50" alt="Agent" class="avatar me-3">
                                        <div>
                                            <div class="fw-bold">Alice Brown</div>
                                            <small class="text-muted">2 vé mở</small>
                                        </div>
                                    </div>
                                    <button class="btn btn-primary btn-sm">Giao</button>
                                </div>
                                <div class="agent-item d-flex align-items-center justify-content-between p-3 border rounded">
                                    <div class="d-flex align-items-center">
                                        <img src="https://via.placeholder.com/50" alt="Agent" class="avatar me-3">
                                        <div>
                                            <div class="fw-bold">Charlie Wilson</div>
                                            <small class="text-muted">7 vé mở</small>
                                        </div>
                                    </div>
                                    <button class="btn btn-primary btn-sm">Giao</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/app.js"></script>
    <!-- Include HTML components -->
    <script src="https://www.w3schools.com/lib/w3.js"></script>
    <script>w3.includeHTML();</script>
</body>
</html>
